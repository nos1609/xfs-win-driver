# Build xfs.exe for both Windows architectures and attach the release zip to
# a GitHub Release on every `v*` tag.
#
# Packaging is `installer/package.ps1`: a zip plus install.ps1/uninstall.ps1.
# There used to be a WiX stage here (Product.wxs, Bundle.wxs, Setup.exe, an
# MSI, and a silent-install check). It is gone by decision, not by accident --
# installer/README.md carries the reasoning, including the correction to the
# claim that CI could not accept the WiX EULA: it did, on a line this file no
# longer has.
#
# What replaces the deleted verify-silent.ps1 checks more than it did. That
# script asserted a Burn bundle came up without a GUI prompt. This workflow
# unpacks the shipped zip and runs the same scripts a user runs, then asserts
# the result: service Running, Start=2 plus DelayedAutostart=1 read back from
# the registry, launcher class present with --ro, install dir on the system
# PATH -- and after uninstall.ps1, all of it gone and PATH byte-exact restored.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the zip to (e.g. v0.1.0). Leave empty to build and verify the installer without publishing anything.'
        required: false
        default: ''

permissions:
  contents: write   # gh release upload needs this

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Everything this crate compiles against is a sibling checkout one
      # directory up -- not vendored, not a submodule (chores.yml's header
      # explains why). The version of this file that was replaced checked out
      # only this repository with `submodules: recursive`, and with no
      # .gitmodules that leaves `path = "../rust-fs-core"` unresolvable: the
      # build step could not have succeeded as written.
      - name: check out siblings at the refs chores.yml pins
        uses: ./.github/actions/siblings

      - name: install Rust with the MSVC target
        shell: pwsh
        run: |
          # The runner image carries a stable toolchain, so only the target is
          # missing. No LLVM-MinGW and no gnullvm: the MSVC toolchain builds
          # this whole stack unpatched, and the task spec rules gnullvm out
          # unless MSVC fails.
          rustup target add ${{ matrix.rust_target }}
          rustc --version
          cargo --version

      - name: install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          # Pin to LLVM 18 -- the last release with stable Windows ARM64
          # binaries on the action's manifest, and old enough to parse sysroot
          # headers without the AVX-512 self-compile errors a same-version
          # libclang trips on. The action sets LIBCLANG_PATH.
          version: '18.1'
          directory: ${{ runner.temp }}/llvm

      - name: install WinFsp (build-time headers + libs)
        shell: pwsh
        run: |
          choco install winfsp --yes --no-progress
          # The Developer feature supplies inc/ and lib/. A default install
          # has been observed to place only bin/ and SxS/, after which
          # winfsp-sys/build.rs cannot find the SDK -- so fail here with the
          # remedy in the message instead of three compile errors later.
          $winfsp = (Get-ItemProperty `
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'WinFsp*' -and $_.InstallLocation } |
              Select-Object -First 1).InstallLocation
          if (-not $winfsp) { $winfsp = 'C:\Program Files (x86)\WinFsp\' }
          Write-Host "WinFsp at: $winfsp"
          if (-not (Test-Path (Join-Path $winfsp 'inc\winfsp\fsctl.h'))) {
            throw "WinFsp SDK headers missing under $winfsp (need ADDLOCAL=F.Main,F.User,F.Developer)"
          }

      # The old file patched WinFsp's fsctl.h here for x64, to work around
      # clang's MSVC-compatibility mode predefining _ReadWriteBarrier before
      # fsctl.h forward-declares it. If the x64 leg fails that way now, put
      # the patch back -- guarded, and pointed at ../winfsp-rs rather than the
      # vendor/winfsp-rs path it named, which does not exist in this layout.
      - name: cargo build --release --features mount,service
        shell: pwsh
        env:
          # Defang AVX-512 intrinsic header compilation; cross-version
          # libclang/sysroot self-compiles can fail there. WinFsp's ABI
          # references no AVX-512 types, so neutering the macros is safe.
          BINDGEN_EXTRA_CLANG_ARGS: -D__AVX512F__=0 -D__AVX512BW__=0 -D__AVX512CD__=0 -D__AVX512DQ__=0 -D__AVX512VL__=0 -D__AVX512VBMI__=0 -D__AVX512VBMI2__=0
        run: |
          cargo build --release --features mount,service --target ${{ matrix.rust_target }}
          $exe = "target\${{ matrix.rust_target }}\release\xfs.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          "Built $exe ($((Get-Item $exe).Length) bytes)"

      - name: check the installer scripts (Pester)
        # Cheap, and the only thing standing between "someone edited
        # install.ps1" and a released zip that installs a broken service.
        # Runs before packaging, so a broken script never reaches a zip that
        # the next step would otherwise go on to install on this runner.
        uses: ./.github/actions/pester

      - name: package the release zip
        shell: pwsh
        run: |
          # -SkipBuild: cargo built it above, for the right --target.
          # package.ps1 re-checks the PE Machine against -Arch and refuses to
          # package a binary that disagrees.
          installer\package.ps1 -Arch ${{ matrix.arch }} -SkipBuild -OutputDir dist
          Get-ChildItem dist\*.zip | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

      - name: install from the shipped zip, then uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem "dist\xfs-win-driver-*-${{ matrix.arch }}.zip" | Select-Object -First 1).FullName
          if (-not $zip) { throw 'no zip produced' }
          $dir = Join-Path $env:RUNNER_TEMP 'zipcheck'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

          # A zip missing one helper installs fine and then dies on the first
          # dot-source, so assert the payload before trusting it.
          foreach ($f in @('xfs.exe','install.ps1','uninstall.ps1','Mount-Xfs.ps1','winfsp-pin.ps1','machine-path.ps1','README.md')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "zip is missing $f" }
          }

          $pathBefore = [Environment]::GetEnvironmentVariable('Path', 'Machine')

          & (Join-Path $dir 'install.ps1')

          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\XfsWatcher'
          $p = Get-ItemProperty $key
          if ([int]$p.Start -ne 2) { throw "expected Start=2, found $($p.Start)" }
          if ([int]$p.DelayedAutostart -ne 1) { throw "expected DelayedAutostart=1, found $($p.DelayedAutostart)" }
          if ((Get-Service XfsWatcher).Status -ne 'Running') { throw 'service is not Running' }

          $cls = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\WinFsp\Services\xfs-mount'
          if ($cls.CommandLine -notmatch '--ro') { throw "launcher template lost --ro: $($cls.CommandLine)" }
          $installDir = Split-Path -Parent $cls.Executable
          $pathAfter = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (($pathAfter -split ';') -notcontains $installDir) { throw "install dir not on system PATH: $installDir" }
          Write-Host 'install.ps1: running, delayed start verified, class has --ro, PATH extended'

          # Cheapest proof the binary matches the runner's CPU: it has to run.
          $help = & $cls.Executable --help 2>&1 | Out-String
          if ($help -notmatch 'mount') { throw 'xfs.exe --help did not mention the mount subcommand' }

          & (Join-Path $dir 'uninstall.ps1')
          if (Get-Service XfsWatcher -ErrorAction SilentlyContinue) { throw 'service survived uninstall' }
          if (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\WinFsp\Services\xfs-mount') { throw 'launcher class survived uninstall' }
          $pathFinal = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (($pathFinal -split ';') -contains $installDir) { throw 'PATH entry survived uninstall' }
          if ($pathFinal -ne $pathBefore) { throw "PATH not restored byte-exact ($($pathBefore.Length) -> $($pathFinal.Length))" }
          Write-Host 'uninstall.ps1: service, class, files and PATH entry all gone'

      - name: upload the zip as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: xfs-win-driver-${{ matrix.arch }}
          path: dist/xfs-win-driver-*-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release upload $tag (Get-ChildItem "dist\xfs-win-driver-*-${{ matrix.arch }}.zip").FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attach to GitHub Release (manual dispatch)
        # An empty tag skips this rather than failing it. The dispatch exists
        # to answer "does the zip install", and that question is answered two
        # steps earlier; throwing at the end burned fifteen minutes of build
        # and left the run red for no finding.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          gh release upload $tag (Get-ChildItem "dist\xfs-win-driver-*-${{ matrix.arch }}.zip").FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: report what winget still needs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Deliberately not automated. winget/installer.yaml still describes a
          # Burn bundle that can no longer be produced, and it quotes SHA-256
          # values for release assets that were never published. Before any
          # submission PR: move the manifest to the zip shape (InstallerType
          # archive with InstallCommands/UninstallCommands) and take the
          # checksums from an uploaded asset. Printed here so the numbers are
          # one scroll away.
          Write-Warning 'winget manifest is stale: it still describes the removed bundle installer.'
          Get-ChildItem "dist\xfs-win-driver-*-${{ matrix.arch }}.zip" | ForEach-Object {
            Write-Host ("  {0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name)
          }
