version: "3"
chore_min_version: 0.6.0

# EVERY DEPENDENCY IS A SIBLING HERE, INCLUDING THE THIRD-PARTY FORK.
#
# This differs from erofs-win-driver and ext4-win-driver, which keep
# vendor/winfsp-rs as a git submodule, and the difference is worth
# stating rather than leaving as an accident of how this repo was
# created.
#
# The argument for a submodule is that winfsp-rs is our fork of someone
# else's crate, carrying a patch that is not ours to release, and that
# no other repo wants that revision. The second half stopped being true:
# both existing drivers pinned the SAME revision, because upstream 0.13.0
# does not compile for *-pc-windows-gnullvm.
#
# That symmetry has now broken deliberately, and the reason is access,
# not taste: antimatter-studios grants this account `pull` and not `push`
# on every repo in the family, so a fix that the driver needs in order to
# work cannot be put where the org pins point. It goes to a fork under the
# contributor and is referenced from there. Two consequences worth saying
# out loud: the "every consumer builds the same winfsp-rs revision"
# property no longer holds, and a fork is a place someone can delete -- if
# that happens the pin below stops resolving, so the durable fix is still
# a merged upstream change, not this file.
#
# Repos we change are pinned to the fork. Repos we do not are left on the
# org, because forking them would buy nothing and would make it less
# obvious that no local edit is hiding there.

vars:
  # URL beside ref for each: the family is not all in one org
  # (rust-fs-ext4 and rust-fs-ntfs live under christhomas/), and git
  # answers a repo it cannot see with a credential prompt rather than a
  # 404, so a reconstructed URL fails as an auth error.
  FS_CORE_URL: https://github.com/nos1609/rust-fs-core.git
  FS_CORE_REF: v0.2.4
  # Pinned to a tag rather than a commit: no XFS-side change is in this
  # ref yet. When one lands it moves to a branch head, and the bmap-tree
  # descent bug (rust-fs-xfs#250) is the likely first reason for that.
  FS_XFS_URL: https://github.com/nos1609/rust-fs-xfs.git
  FS_XFS_REF: v0.6.0
  # Commit, not tag: v0.2.1 predates the startup disk enumeration and the
  # read-only flag on the watcher's spawn, both of which the driver needs.
  SKELETON_URL: https://github.com/nos1609/winfsp-fs-skeleton.git
  SKELETON_REF: ad0314dbeaf03c0730694d2f8984e25f0687f6ea
  HARNESS_URL: https://github.com/antimatter-studios/fs-test-harness.git
  HARNESS_REF: v3.11.0
  # Commit, not branch: the pinned ancestor carries the gnullvm
  # guard-strategy fix (upstream 0.13.0 declares that constant signed
  # while bindgen emits it unsigned there), and the child carries the
  # directory-entry name fix without which every enumerated name comes
  # back one WCHAR long.
  WINFSP_RS_URL: https://github.com/nos1609/winfsp-rs.git
  WINFSP_RS_REF: 6243135586d827671a16fc968ebd9ba39f6c37ba


tasks:
  siblings:
    desc: Check out the sibling repos this crate builds against, at their pinned refs
    # Refuses to move a sibling with uncommitted work: a checkout is
    # destructive, and a task that also runs in CI must not eat
    # someone's afternoon when they run it locally.
    cmds:
      - |
        set -eu
        printf '%s\t%s\t%s\n' \
          rust-fs-core       '{{.FS_CORE_URL}}'   '{{.FS_CORE_REF}}' \
          rust-fs-xfs        '{{.FS_XFS_URL}}'    '{{.FS_XFS_REF}}' \
          winfsp-fs-skeleton '{{.SKELETON_URL}}'  '{{.SKELETON_REF}}' \
          fs-test-harness    '{{.HARNESS_URL}}'   '{{.HARNESS_REF}}' \
          winfsp-rs          '{{.WINFSP_RS_URL}}' '{{.WINFSP_RS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="../$name"
            if [ ! -d "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git clone --quiet "$url" "$dir"
              git -C "$dir" checkout --quiet "$ref"
              continue
            fi
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes -- refusing to move it." >&2
              exit 1
            fi
            git -C "$dir" fetch --quiet --tags origin
            if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}")" ]; then
              echo "siblings: $name already at $ref"
              continue
            fi
            echo "siblings: moving $name to $ref"
            git -C "$dir" checkout --quiet "$ref"
          done

  check:
    desc: Type-check the parts that build off Windows
    cmds:
      - cargo check --locked --no-default-features
